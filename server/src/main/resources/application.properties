spring.application.name=nihongo-academy
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3308/nihongo_academy
spring.datasource.username=${DB_USERNAME:nihongo}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# OpenJLPT importer
openjlpt.import.enabled=${OPENJLPT_IMPORT_ENABLED:false}
openjlpt.data.path=${OPENJLPT_DATA_PATH:/tmp/openjlpt-data}